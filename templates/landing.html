      filter: saturate(1.05);
    }

    .scrim {
      position: fixed;
      inset: 0;
      background: linear-gradient(180deg, rgba(20, 30, 15, 0.15) 0%, rgba(15, 25, 10, 0.55) 100%);
    }

    .stage {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .launcher {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      animation: rise .7s ease;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(14px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .icon-btn {
      width: 118px;
      height: 118px;
      border-radius: 50%;
      border: 1px solid var(--glass-border);
      background:
        radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0.08) 60%),
        var(--glass);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(10, 20, 5, 0.35), inset 0 0 0 1px rgba(255, 255, 255, 0.15);
      transition: transform .25s ease, box-shadow .25s ease;
      position: relative;
    }

    .icon-btn:hover {
      transform: translateY(-4px) scale(1.03);
      box-shadow: 0 16px 38px rgba(10, 20, 5, 0.45), inset 0 0 0 1px rgba(255, 255, 255, 0.25);
    }

    .icon-btn:active {
      transform: translateY(-1px) scale(0.99);
    }

    .icon-btn svg {
      width: 46px;
      height: 46px;
    }

    .ring {
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.35);
      opacity: 0.7;
    }

    .brand {
      text-align: center;
      color: #f4f4e6;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.45);
    }

    .brand .eyebrow {
      letter-spacing: .28em;
      font-size: 11px;
      text-transform: uppercase;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      opacity: .85;
      margin: 0 0 6px 0;
    }

    .brand h1 {
      margin: 0;
      font-size: 44px;
      font-weight: 500;
      letter-spacing: .02em;
      max-width: 380px;
      line-height: 1.25;
    }

    .go-btn {
      margin-top: 6px;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 13.5px;
      letter-spacing: .06em;
      color: var(--ink);
      background: var(--sun);
      border: none;
      padding: 12px 26px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.25);
      transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
      text-decoration: none;
      display: inline-block;
    }

    .go-btn:hover {
      background: #f2ecA0;
      transform: translateY(-2px);
      box-shadow: 0 12px 26px rgba(0, 0, 0, 0.3);
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="scrim"></div>
